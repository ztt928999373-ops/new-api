name: F2.3 merged acceptance and Mock collection
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [product/v1]
permissions:
  contents: read
jobs:
  budget:
    if: github.event.pull_request.head.ref == 'feat/v1-f23c-mock-collection' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOWORK: 'off'
      CGO_ENABLED: '1'
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: synthetic-test-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: credential_test
        ports: ['23316:3306']
        options: --health-cmd="mysqladmin ping -h localhost -psynthetic-test-only" --health-interval=10s --health-timeout=5s --health-retries=12
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: credential_test
        ports: ['25436:5432']
        options: --health-cmd="pg_isready -U postgres -d credential_test" --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Stage joint acceptance tests for released code
        run: |
          python3 - <<'PY'
          import os, pathlib
          source = pathlib.Path('router/upstream_budget_test.go').read_text()
          pathlib.Path(os.environ['RUNNER_TEMP'], 'released_joint_test.go').write_text(source.split('// F2.3c coordinator acceptance.')[0])
          PY
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 09389363f4742c23c1d0c55a868b0dafb58a16f3
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - name: Verify merged F1 code and security regression
        env:
          SUANJIE_TEST_MYSQL_CONTAINER: ${{ job.services.mysql.id }}
          SUANJIE_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          mkdir -p "$RUNNER_TEMP/f23c-logs" web/dist
          touch web/dist/index.html
          git rev-parse HEAD > "$RUNNER_TEMP/f23c-logs/f1-sha.txt"
          go vet ./...
          go test -json -count=1 ./... > "$RUNNER_TEMP/f23c-logs/f1-full.jsonl"
          cp "$RUNNER_TEMP/released_joint_test.go" router/upstream_budget_test.go
          SUANJIE_TEST_DATABASES=local-synthetic go test -json -race -count=1 ./router -run '^(TestMergedMockCost|TestMockCostBackupRestore)' > "$RUNNER_TEMP/f23c-logs/merged-joint-recovery.jsonl"
          go test -json -race -count=1 ./service -run '^(TestReadOnlyCostSnapshot|TestMockHTTP)' > "$RUNNER_TEMP/f23c-logs/merged-http-snapshot.jsonl"
          SUANJIE_TEST_DATABASES=local-synthetic go test -json -race -count=1 ./middleware -run '^TestDashboardDenialAudit' > "$RUNNER_TEMP/f23c-logs/f11-three-db-race.jsonl"
          SUANJIE_TEST_DATABASES=local-synthetic go test -json -race -count=1 ./model -run '^TestOverallChannelStatusIndependentOfCredentials$' > "$RUNNER_TEMP/f23c-logs/f1-status-race.jsonl"
          SUANJIE_TEST_DATABASES=local-synthetic go test -json -race -count=1 ./router -run '^(TestUpstreamBudget|TestSupplierCost|TestAggregateCostPublication)' > "$RUNNER_TEMP/f23c-logs/merged-f2-race.jsonl"
          go test -json -count=1 ./internal/localops > "$RUNNER_TEMP/f23c-logs/merged-recovery.jsonl"
          SUANJIE_TEST_DATABASES=local-synthetic go test -json -race -count=1 ./service/credentials > "$RUNNER_TEMP/f23c-logs/f1-credential-race.jsonl"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify budget migration, concurrency and Mock upstream
        env:
          SUANJIE_TEST_MYSQL_CONTAINER: ${{ job.services.mysql.id }}
          SUANJIE_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/f23c-logs/f2-sha.txt"
          go test -json -race -count=1 ./service -run '^(TestReadOnlyCostSnapshot|TestMockHTTP)' > "$RUNNER_TEMP/f23c-logs/readonly-costs.jsonl"
          go version > "$RUNNER_TEMP/f23c-logs/go-version.txt"
          SUANJIE_TEST_DATABASES=local-synthetic go test -json -race -count=1 ./router -run '^(TestUpstreamBudget|TestSupplierCost|TestAggregateCostPublication|TestMockCost|TestMergedMockCost)' > "$RUNNER_TEMP/f23c-logs/f2-budget-race-three-db.jsonl"
          SUANJIE_TEST_DATABASES=local-synthetic go test -json -race -count=1 ./middleware ./model ./service/credentials -run '^(TestDashboardDenialAudit.*|TestOverallChannelStatusIndependentOfCredentials|TestStoreDatabaseMatrix|TestResolverOwnerPlatformRevocationAndAuditFailure)$' > "$RUNNER_TEMP/f23c-logs/f2-head-security-race.jsonl"
          go test -json -count=1 ./internal/localops > "$RUNNER_TEMP/f23c-logs/f2-cold-recovery.jsonl"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f23c-cost-acceptance
          path: ${{ runner.temp }}/f23c-logs/
          retention-days: 14

