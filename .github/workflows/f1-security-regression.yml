name: F1 synthetic security regression
on:
  pull_request:
    types: [opened, synchronize]
    branches: [product/v1]
permissions:
  contents: read
jobs:
  security:
    if: github.event.pull_request.draft == true && github.event.pull_request.head.ref == 'test/v1-f1-security' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GOWORK: 'off'
      CGO_ENABLED: '1'
      SUANJIE_TEST_DATABASES: local-synthetic
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: synthetic-test-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: credential_test
        ports: ['23316:3306']
        options: --health-cmd="mysqladmin ping -h localhost -psynthetic-test-only" --health-interval=10s --health-timeout=5s --health-retries=12
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: credential_test
        ports: ['25436:5432']
        options: --health-cmd="pg_isready -U postgres -d credential_test" --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - name: Synthetic regression and race
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p f1-logs
          { git rev-parse HEAD; go version; } > f1-logs/environment.txt
          go test -json -count=1 ./router ./middleware ./service/credentials ./service/authz > f1-logs/security.jsonl
          go test -json -race -count=1 ./model -run '^TestOverallChannelStatusIndependentOfCredentials$' > f1-logs/status-race.jsonl
          go test -json -race -count=1 ./service/credentials > f1-logs/credential-race.jsonl
          go test -json -count=1 ./service -run '^TestManagedRequestPollingCacheAndRevocation$' > f1-logs/managed-sqlite.jsonl
          SYNTHETIC_MANAGED_DATABASE=mysql go test -json -count=1 ./service -run '^TestManagedRequestPollingCacheAndRevocation$' > f1-logs/managed-mysql.jsonl
          SYNTHETIC_MANAGED_DATABASE=postgres go test -json -count=1 ./service -run '^TestManagedRequestPollingCacheAndRevocation$' > f1-logs/managed-postgres.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f1-synthetic-security
          path: f1-logs/
          retention-days: 14
