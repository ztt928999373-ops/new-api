name: PR 5 credential acceptance
on:
  pull_request:
    types: [synchronize]
    branches: [product/v1]
permissions:
  contents: read
concurrency:
  group: pr5-credential-acceptance
  cancel-in-progress: false
jobs:
  acceptance:
    if: github.event.pull_request.number == 5 && github.event.pull_request.head.ref == 'feature/v1-credential-security' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GOWORK: 'off'
      CGO_ENABLED: '1'
      SUANJIE_TEST_DATABASES: local-synthetic
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: synthetic-test-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: credential_test
        ports: ['23316:3306']
        options: --health-cmd="mysqladmin ping -h localhost -psynthetic-test-only" --health-interval=10s --health-timeout=5s --health-retries=12
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: credential_test
        ports: ['25436:5432']
        options: --health-cmd="pg_isready -U postgres -d credential_test" --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Prepare and record exact environment
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y gcc libc6-dev
          mkdir -p acceptance-logs web/dist
          touch web/dist/index.html
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          { git rev-parse HEAD; go version; gcc --version; go env CGO_ENABLED; date -u; } | tee acceptance-logs/environment.log
          docker exec '${{ job.services.mysql.id }}' mysql --version | tee acceptance-logs/mysql-version.log
          docker exec '${{ job.services.postgres.id }}' postgres --version | tee acceptance-logs/postgres-version.log
      - name: Race and three database acceptance
        shell: bash
        run: |
          set -uo pipefail
          status=0
          run_test() {
            name="$1"; shift
            start=$SECONDS
            "$@" > "acceptance-logs/$name.json" 2>&1
            result=$?
            echo "$name exit=$result duration_seconds=$((SECONDS-start))" | tee -a acceptance-logs/results.log
            if [ "$result" -ne 0 ]; then cat "acceptance-logs/$name.json"; status=1; fi
          }
          run_test status-race go test -json -race ./model -run '^TestOverallChannelStatusIndependentOfCredentials$' -count=3 -timeout=8m
          run_test controller-race go test -json -race ./controller -run '^TestManageMultiKeysOverallStatusContention$' -count=3 -timeout=5m
          run_test credentials-race go test -json -race ./service/credentials ./pkg/credentialcrypto -count=3 -timeout=8m
          for engine in mysql postgres; do
            if [ "$engine" = mysql ]; then
              dsn='root:synthetic-test-only@tcp(127.0.0.1:23316)/credential_test?parseTime=true'
            else
              dsn='postgres://postgres:synthetic-test-only@127.0.0.1:25436/credential_test?sslmode=disable'
            fi
            run_test "$engine-controller" env TEST_CHANNEL_SQL_DSN="$dsn" go test -json -race ./controller -run '^TestMultiKeyEnableRestoresOnlyExhaustedChannels$' -count=3 -timeout=5m
            run_test "$engine-managed" env SYNTHETIC_MANAGED_DATABASE="$engine" go test -json -race ./service -run '^TestManagedRequestPollingCacheAndRevocation$' -count=3 -timeout=5m
          done
          exit "$status"
      - name: Preserve acceptance logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr5-credential-acceptance-${{ github.event.pull_request.head.sha }}
          path: acceptance-logs/
          retention-days: 14
