name: V1 security and cost regression
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [product/v1]
  push:
    branches: [product/v1]
permissions:
  contents: read
concurrency:
  group: v1-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    name: V1 security regression (3 databases)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOWORK: 'off'
      CGO_ENABLED: '1'
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: synthetic-test-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: credential_test
        ports: ['23316:3306']
        options: --health-cmd="mysqladmin ping -h localhost -psynthetic-test-only" --health-interval=10s --health-timeout=5s --health-retries=12
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: credential_test
        ports: ['25436:5432']
        options: --health-cmd="pg_isready -U postgres -d credential_test" --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - name: Security, login audit and financial invariants
        env:
          SUANJIE_TEST_MYSQL_CONTAINER: ${{ job.services.mysql.id }}
          SUANJIE_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          SUANJIE_TEST_DATABASES: local-synthetic
        run: |
          mkdir -p "$RUNNER_TEMP/v1-security" web/dist
          touch web/dist/index.html
          { git rev-parse HEAD; go version; } > "$RUNNER_TEMP/v1-security/environment.txt"
          go vet ./...
          # Synthetic inherited lowercase proxies reproduce the cloud fixture
          # contamination; this unit test makes no outbound network requests.
          env http_proxy=http://inherited-http.invalid:8080 https_proxy=http://inherited-https.invalid:8080 ALL_PROXY=http://inherited-all.invalid:8080 \
            go test -json -race -count=1 ./service -run '^TestUpstreamAddressesMaskOnlyConfiguredAddresses$' > "$RUNNER_TEMP/v1-security/proxy-isolation.jsonl"
          go test -json -race -count=1 ./router -run '^(TestOpenAIPilotAuthenticatedSettlement|TestBailianPilotAuthenticatedSettlement)$' > "$RUNNER_TEMP/v1-security/upstream-error-redaction.jsonl"
          go test -json -race -count=1 ./router -run '^TestPasswordLoginFailureAudit' > "$RUNNER_TEMP/v1-security/login-audit.jsonl"
          go test -json -race -count=1 ./middleware -run '^TestDashboardDenialAudit' > "$RUNNER_TEMP/v1-security/denial-audit.jsonl"
          TEST_MYSQL_DSN='root:synthetic-test-only@tcp(127.0.0.1:23316)/credential_test?parseTime=true' \
            TEST_POSTGRES_DSN='postgres://postgres:synthetic-test-only@127.0.0.1:25436/credential_test?sslmode=disable' \
            go test -json -race -count=3 ./controller -run '^TestPreConsumePolicyDatabaseMatrix$' > "$RUNNER_TEMP/v1-security/model-fixture-lifecycle.jsonl"
          TEST_PERF_MYSQL_DSN='root:synthetic-test-only@tcp(127.0.0.1:23316)/credential_test?parseTime=true' \
            TEST_PERF_POSTGRES_DSN='postgres://postgres:synthetic-test-only@127.0.0.1:25436/credential_test?sslmode=disable' \
            go test -json -race -count=3 ./pkg/perf_metrics > "$RUNNER_TEMP/v1-security/perf-fixture-lifecycle.jsonl"
          go test -json -race -count=10 -cpu=1,2,4 ./model -run '^(TestBatchUpdateAccumulatesTwoMaximumRequestCharges|TestBatchUpdateAccumulatorSaturatesOverflow|TestReserveFallsBackToDatabaseWhenRedisIsUnavailable)$' > "$RUNNER_TEMP/v1-security/model-quota-cache-lifecycle.jsonl"
          go test -json -race -count=3 ./model > "$RUNNER_TEMP/v1-security/model-package-race.jsonl"
          go test -json -race -count=10 ./relay/channel > "$RUNNER_TEMP/v1-security/header-override-race.jsonl"
          go test -json -race -count=10 ./relay/channel/gemini ./relay/channel/minimax > "$RUNNER_TEMP/v1-security/gin-mode-race.jsonl"
          go test -json -race -count=3 ./service -run '^TestUpdateVideoTasksSlowChannelDoesNotBlockOtherChannels$' > "$RUNNER_TEMP/v1-security/service-polling-observation-race.jsonl"
          go test -json -race -count=1 ./model -run '^TestOverallChannelStatusIndependentOfCredentials$' > "$RUNNER_TEMP/v1-security/channel-status.jsonl"
          go test -json -race -count=1 ./model -run '^TestTokenRevocation' > "$RUNNER_TEMP/v1-security/token-revocation.jsonl"
          go test -json -race -count=1 ./service/credentials > "$RUNNER_TEMP/v1-security/credentials.jsonl"
          go test -json -race -count=1 ./router -run '^TestChannelKeySecurity' > "$RUNNER_TEMP/v1-security/channel-key-security.jsonl"
          for database in sqlite mysql postgres; do
            SYNTHETIC_MANAGED_DATABASE="$database" go test -json -race -count=1 ./service -run '^TestManagedRequestPollingCacheAndRevocation$' > "$RUNNER_TEMP/v1-security/managed-$database.jsonl"
          done
          go test -json -race -count=1 ./service -run '^TestEncryptedChannelMigration' > "$RUNNER_TEMP/v1-security/channel-migration.jsonl"
          go test -json -race -count=1 ./router -run '^(TestUpstreamBudget|TestSupplierCost|TestAggregateCostPublication|TestMockCost|TestMergedMockCost)' > "$RUNNER_TEMP/v1-security/costs-routing.jsonl"
          go test -json -race -count=1 ./service -run '^(TestReadOnlyCostSnapshot|TestMockHTTP)' > "$RUNNER_TEMP/v1-security/http-snapshot.jsonl"
          go test -json -count=1 ./internal/localops > "$RUNNER_TEMP/v1-security/localops.jsonl"
      - name: Synthetic hot lookup comparison
        run: |
          go test -run '^$' -bench '^BenchmarkTokenHotLookup$' -benchtime=1s -count=3 -cpu=1,2 -benchmem ./model > "$RUNNER_TEMP/v1-security/token-auth-benchmark.txt"
          {
            echo '### Synthetic hot Token lookup: baseline vs candidate'
            echo 'Loopback miniredis and in-memory SQLite, SQL pool max=1. Lookup phase only; no HTTP, real upstream or production latency claim. ns/op in parallel is throughput-normalized wall time, not request latency percentiles.'
            echo '```text'
            cat "$RUNNER_TEMP/v1-security/token-auth-benchmark.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import collections, os, pathlib, re, statistics, subprocess
          text = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'v1-security/token-auth-benchmark.txt').read_text()
          groups = collections.defaultdict(list)
          for line in text.splitlines():
              match = re.match(r'BenchmarkTokenHotLookup/(before|after)/(serial|parallel)(?:-(\d+))?\s+\d+\s+', line)
              if match:
                  metrics = {unit: float(value) for value, unit in re.findall(r'([\d.eE+-]+)\s+(ns/op|lookup/s|sql/op)\b', line)}
                  groups[(match[1], match[2], int(match[3] or 1))].append(metrics)
          if len(groups) != 8 or any(len(samples) != 3 for samples in groups.values()):
              raise SystemExit('Expected eight groups with three benchmark measurements each')
          environment = [subprocess.check_output(['go', 'version'], text=True).strip()]
          environment += [line for line in text.splitlines() if line.startswith(('goos:', 'goarch:', 'cpu:'))]
          print('::notice title=Synthetic benchmark environment::' + '; '.join(environment))
          for (version, mode, cpu), samples in sorted(groups.items()):
              expected = 0 if version == 'before' else 1
              if any(sample.get('sql/op') != expected for sample in samples):
                  raise SystemExit('Unexpected SQL count in hot lookup measurement')
              ns = statistics.median(sample['ns/op'] for sample in samples)
              rate = statistics.median(sample['lookup/s'] for sample in samples)
              print(f'::notice title=Synthetic lookup {version} {mode} cpu={cpu}::version={version}; mode={mode}; cpu={cpu}; median_of_3 ns/op={ns:.3f}; lookup/s={rate:.3f}; sql/op={expected}; loopback miniredis + memory SQLite, pool=1; not production latency')
          PY
      - name: Summarize revocation evidence
        if: always()
        run: |
          python3 - <<'PY'
          import collections, json, os, pathlib, re
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'v1-security'
          rows, versions = [], set()
          source = root / 'token-revocation.jsonl'
          if source.exists():
              for line in source.read_text().splitlines():
                  try:
                      event = json.loads(line)
                  except ValueError:
                      continue
                  if event.get('Test') and event.get('Action') in ('pass', 'fail', 'skip'):
                      rows.append((event['Test'], event['Action']))
                  match = re.search(r'synthetic revocation database=(sqlite|mysql|postgres) version=([^\r\n]+)', event.get('Output', ''))
                  if match:
                      versions.add(match.group(0))
          counts = dict(collections.Counter(status for _, status in rows))
          print(f'::notice title=Revocation JSON event counts::{json.dumps(counts, sort_keys=True)}; counts include parent tests and subtests')
          for version in sorted(versions):
              print(f'::notice title=Synthetic database version::{version}')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('\n### Revocation JSON event summary\n')
              out.write('Counts include parent tests and subtests; absence of events is not success.\n\n')
              out.write(f'Observed test events: {counts}\n\n')
              for version in sorted(versions):
                  out.write(version + '\n\n')
              out.write('| Test | Result |\n| --- | --- |\n')
              for name, status in rows:
                  out.write(f'| {name.replace("|", "&#124;")} | {status} |\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v1-security-regression
          path: ${{ runner.temp }}/v1-security/
          retention-days: 14
