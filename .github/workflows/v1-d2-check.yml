name: D2 发布机制专项检查（无推送）
on:
  pull_request:
    branches: [product/v1]
    paths: ['.github/automation/ghcr-release*', '.github/workflows/v1-d2-*.yml', 'deploy/d2/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - run: node --test .github/automation/ghcr-release.test.cjs
