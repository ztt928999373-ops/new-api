name: new-api-phase2-local
services:
  new-api:
    image: calciumion/new-api:v1.0.0-rc.47@sha256:938fa2713d4946723c9e9ce3076351c33f7770699fec92d23f3a26fd95791026
    restart: unless-stopped
    volumes: [new-api-phase2-data:/data]
    networks: [mock-only]
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?initialize local secrets}
      DEFAULT_LANGUAGE: en
      TRUSTED_PROXIES: none
      RELAY_TIMEOUT: '2'
      RELAY_RESPONSE_HEADER_TIMEOUT: '2'
      STREAMING_TIMEOUT: '5'
      BATCH_UPDATE_ENABLED: 'false'
      GLOBAL_API_RATE_LIMIT: '10000'
      CRITICAL_RATE_LIMIT: '1000'
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      ALL_PROXY: ''
      NO_PROXY: '*'
      http_proxy: ''
      https_proxy: ''
      all_proxy: ''
      no_proxy: '*'
    depends_on: [mock]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:3000/api/status']
      interval: 5s
      timeout: 3s
      retries: 20
  mock:
    restart: unless-stopped
    image: python:3.12.12-slim-bookworm@sha256:593bd06efe90efa80dc4eee3948be7c0fde4134606dd40d8dd8dbcade98e669c
    command: [python, /phase2/mock.py]
    volumes: ['.:/phase2:ro']
    ports: ['127.0.0.1:${NEW_API_PORT:-3067}:3000']
    networks: [mock-only, viewer-edge]
    read_only: true
    tmpfs: [/tmp]
    environment:
      PYTHONDONTWRITEBYTECODE: '1'
      TEST_ADMIN_PASSWORD: ${TEST_ADMIN_PASSWORD:?initialize local secrets}
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      ALL_PROXY: ''
      NO_PROXY: '*'
      http_proxy: ''
      https_proxy: ''
      all_proxy: ''
      no_proxy: '*'
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/api/status', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  new-api-phase2-data:
networks:
  mock-only:
    internal: true
  viewer-edge: {}
